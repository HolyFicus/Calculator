<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Умный калькулятор оценок</title>
    <meta name="description" content="Умный калькулятор студенческих оценок с математическим прогнозом, гибкой шкалой баллов, AI-советником и обменом шаблонами дисциплин." />
    <meta property="og:title" content="Умный калькулятор оценок" />
    <meta property="og:description" content="Умный калькулятор студенческих оценок с математическим прогнозом, гибкой шкалой баллов, AI-советником и обменом шаблонами дисциплин." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ignore WebSocket / HMR errors in preview environment where HMR is disabled
      window.addEventListener('unhandledrejection', function(event) {
        var str = (event.reason && (event.reason.message || event.reason.toString())) || '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var str = (event.message || event.error && event.error.message) || '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
